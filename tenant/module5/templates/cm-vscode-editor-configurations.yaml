{{/*
Disable che-code extension auto-update for Module 5. Versions are pinned once
in cluster/openvsx/files/extension-list.json (uploader honors those pins for
dependencies too); this ConfigMap only stops the IDE from chasing updates.
che-code reads it (app.kubernetes.io/part-of: che.eclipse.org) into Machine
settings on workspace start.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vscode-editor-configurations
  namespace: {{ include "module5.namespace" . }}
  annotations:
    {{- include "module5.workspace-syncwave" . | nindent 4 }}
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    helm.sh/chart: {{ include "module5.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  settings.json: |
    {
      "extensions.autoUpdate": false,
      "extensions.autoCheckUpdates": false
    }
