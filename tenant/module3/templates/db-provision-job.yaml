apiVersion: batch/v1
kind: Job
metadata:
  name: db-provision-{{ .Values.tenant.username }}
  namespace: {{ .Values.admin.namespace }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-provision
          image: registry.redhat.io/rhel9/postgresql-16:latest
          env:
            - name: PGPASSWORD
              value: {{ .Values.sharedDatabase.adminPassword }}
            - name: USER_PASS
              value: {{ .Values.tenant.password | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -e

              DB_HOST="postgres.{{ .Values.sharedDatabase.namespace }}.svc.cluster.local"
              DB_NAME="{{ .Values.sharedDatabase.database }}"
              DB_ADMIN="{{ .Values.sharedDatabase.adminUser }}"
              USERNAME="{{ .Values.tenant.username }}"

              echo "Provisioning database schema for ${USERNAME}..."

              psql -h "$DB_HOST" -U "$DB_ADMIN" -d "$DB_NAME" <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${USERNAME}') THEN
                  CREATE ROLE ${USERNAME} LOGIN PASSWORD '${USER_PASS}';
                  GRANT ${USERNAME} TO ${DB_ADMIN};
                END IF;
              END
              \$\$;

              CREATE SCHEMA IF NOT EXISTS ${USERNAME} AUTHORIZATION ${USERNAME};

              CREATE TABLE IF NOT EXISTS ${USERNAME}.invoices (
                  id CHARACTER VARYING NOT NULL,
                  data TEXT NOT NULL,
                  version INTEGER NOT NULL DEFAULT 0,
                  PRIMARY KEY (id)
              );

              CREATE OR REPLACE FUNCTION ${USERNAME}.increment_version()
              RETURNS TRIGGER AS \$\$
              BEGIN
                  NEW.version := OLD.version + 1;
                  RETURN NEW;
              END;
              \$\$ LANGUAGE plpgsql;

              DROP TRIGGER IF EXISTS invoices_version_trigger ON ${USERNAME}.invoices;
              CREATE TRIGGER invoices_version_trigger
                  BEFORE UPDATE ON ${USERNAME}.invoices
                  FOR EACH ROW
                  EXECUTE FUNCTION ${USERNAME}.increment_version();

              ALTER TABLE ${USERNAME}.invoices OWNER TO ${USERNAME};
              ALTER FUNCTION ${USERNAME}.increment_version() OWNER TO ${USERNAME};

              INSERT INTO ${USERNAME}.invoices (id, data) VALUES
              ('61356291', '<Invoice>
                 <InvoiceNumber>61356291</InvoiceNumber>
                 <DateOfIssue>20120906</DateOfIssue>
                 <Seller>
                    <Name>Rodriguez-Stevens</Name>
                    <Address>
                       <Street>2280 Angela Plain</Street>
                       <City>Hortonshire</City>
                       <State>MS</State>
                       <PostalCode>93248</PostalCode>
                    </Address>
                    <TaxId>939988477</TaxId>
                    <IBAN>GB50ACIE59715038217063</IBAN>
                 </Seller>
                 <Client>
                    <Name>Chapman, Kim and Green</Name>
                    <Address>
                       <Street>64731 James Branch</Street>
                       <City>Smithmouth</City>
                       <State>NC</State>
                       <PostalCode>26872</PostalCode>
                    </Address>
                    <TaxId>949849105</TaxId>
                 </Client>
                 <Items>
                    <Item>
                       <Number>1</Number>
                       <ProductID>WINEGLASS01</ProductID>
                       <Description>Wine Glasses Goblets Pair Clear Glass</Description>
                       <Quantity>5</Quantity>
                       <UnitOfMeasure>Each</UnitOfMeasure>
                       <NetPrice>12</NetPrice>
                       <NetWorth>60</NetWorth>
                       <VATPercentage>10</VATPercentage>
                       <GrossWorth>66</GrossWorth>
                    </Item>
                    <Item>
                       <Number>2</Number>
                       <ProductID>WINERACK01</ProductID>
                       <Description>With Hooks Stemware Storage Multiple Uses Iron Wine Rack Hanging Glass</Description>
                       <Quantity>4</Quantity>
                       <UnitOfMeasure>Each</UnitOfMeasure>
                       <NetPrice>28.08</NetPrice>
                       <NetWorth>112.32</NetWorth>
                       <VATPercentage>10</VATPercentage>
                       <GrossWorth>123.55</GrossWorth>
                    </Item>
                    <Item>
                       <Number>3</Number>
                       <ProductID>CORKSCREW01</ProductID>
                       <Description>Replacement Corkscrew Parts Spiral Worm Wine Opener Bottle Houdini</Description>
                       <Quantity>1</Quantity>
                       <UnitOfMeasure>Each</UnitOfMeasure>
                       <NetPrice>7.5</NetPrice>
                       <NetWorth>7.5</NetWorth>
                       <VATPercentage>10</VATPercentage>
                       <GrossWorth>8.25</GrossWorth>
                    </Item>
                    <Item>
                       <Number>4</Number>
                       <ProductID>STEMLESS01</ProductID>
                       <Description>HOME ESSENTIALS GRADIENT STEMLESS WINE GLASSES SET OF 4 20 FL OZ (591 ml) NEW</Description>
                       <Quantity>1</Quantity>
                       <UnitOfMeasure>Each</UnitOfMeasure>
                       <NetPrice>12.99</NetPrice>
                       <NetWorth>12.99</NetWorth>
                       <VATPercentage>10</VATPercentage>
                       <GrossWorth>14.29</GrossWorth>
                    </Item>
                 </Items>
                 <Summary>
                    <VATPercentage>10</VATPercentage>
                    <NetWorth>192.81</NetWorth>
                    <VATAmount>19.28</VATAmount>
                    <GrossWorth>212.09</GrossWorth>
                 </Summary>
              </Invoice>')
              ON CONFLICT (id) DO NOTHING;
              EOSQL

              echo "Database provisioning complete for ${USERNAME}."
