apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.openshiftPipelines.name "namespace" .Values.argocd.namespace "syncWave" "1") }}
spec:
  destination:
    namespace: {{ .Values.openshiftPipelines.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cluster/openshift-pipelines
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    # CLG testing alternative catalog for installing Pipelines
    helm: {}
    #   valuesObject:
    #     subscription:
    #       source: {{ include "app-of-apps.operatorSource" . }}
  syncPolicy:
    automated: {}
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 30
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
