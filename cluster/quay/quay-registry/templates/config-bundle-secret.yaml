---
# Static config-bundle Secret.
# On AWS: this is managed by the quay-secret ArgoCD Application instead
# (cluster/quay-secret/externalsecret.yaml) so Quay gets S3 credentials
# from Vault via ExternalSecret without Helm subchart rendering issues.
#
# On CNV: this static secret is used (ODF objectstorage: managed: true).
#
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quay-registry.name" . }}-config-bundle
  labels:
    {{- include "quay-registry.labels" . | nindent 4 }}
  annotations:
    {{- include "quay-registry.quay.argocd-syncwave" . | nindent 4 }}
stringData:
  config.yaml: |-
    REGISTRY_TITLE: {{ .Values.quay.displayName }}
    SERVER_HOSTNAME: {{ .Values.quay.host }}
    EXTERNAL_TLS_TERMINATION: {{ .Values.quay.tls }}
    CREATE_PRIVATE_REPO_ON_PUSH: false
    {{- if .Values.quay.configureAdmin }}
    SUPER_USERS:
    - {{ .Values.quay.adminUser }}
    FEATURE_USER_INITIALIZE: {{ .Values.quay.userInitialize }}
    {{- end }}
