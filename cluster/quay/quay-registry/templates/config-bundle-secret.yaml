---
# ExternalSecret — pulls S4 credentials from Vault and builds the
# quay-config-bundle Secret with S3 connection details.
#
# SYNC ORDERING:
#   This ExternalSecret runs at wave -1 (before Quay at wave 0).
#   Ansible (ocp4_workload_dev_days_rdshw_cluster_bootstrap) MUST write
#   kv/secrets/s4 to Vault AFTER app-of-apps sync (Vault deployed first).
#
# VAULT PATH CONTRACT (ESO path — omit kv/ prefix, ESO uses path: kv):
#   secrets/s4:
#     access_key: s4admin
#     secret_key: <common_password from agnosticv>
#
# SERVER_HOSTNAME: taken from .Values.quay.host (set in app-of-apps values.yaml)
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "quay-registry.name" . }}-config-bundle
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quay-registry.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ include "quay-registry.name" . }}-config-bundle
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          REGISTRY_TITLE: {{ .Values.quay.displayName }}
          SERVER_HOSTNAME: {{ .Values.quay.host }}
          EXTERNAL_TLS_TERMINATION: {{ .Values.quay.tls }}
          CREATE_PRIVATE_REPO_ON_PUSH: false
          {{- if .Values.quay.configureAdmin }}
          SUPER_USERS:
          - {{ .Values.quay.adminUser }}
          FEATURE_USER_INITIALIZE: {{ .Values.quay.userInitialize }}
          {{- end }}
          DISTRIBUTED_STORAGE_CONFIG:
            s4Storage:
              - RadosGWStorage
              - access_key: {{ `{{ .s4_access_key }}` }}
                secret_key: {{ `{{ .s4_secret_key }}` }}
                bucket_name: {{ .Values.quay.s4.bucketName }}
                hostname: s4-service.{{ .Values.quay.s4.namespace }}.svc.cluster.local
                port: 80
                is_secure: false
                storage_path: /datastorage/registry
          DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS:
          - s4Storage
          DISTRIBUTED_STORAGE_PREFERENCE:
          - s4Storage
  data:
  - secretKey: s4_access_key
    remoteRef:
      key: secrets/s4
      property: access_key
  - secretKey: s4_secret_key
    remoteRef:
      key: secrets/s4
      property: secret_key
