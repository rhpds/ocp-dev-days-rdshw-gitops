---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quay-registry.name" . }}-config-bundle
  labels:
    {{- include "quay-registry.labels" . | nindent 4 }}
  annotations:
    {{- include "quay-registry.quay.argocd-syncwave" . | nindent 4 }}
stringData:
  config.yaml: |-
    REGISTRY_TITLE: {{ .Values.quay.displayName }}
    SERVER_HOSTNAME: {{ .Values.quay.host }}
    EXTERNAL_TLS_TERMINATION: {{ .Values.quay.tls }}
    CREATE_PRIVATE_REPO_ON_PUSH: false
    {{- if .Values.quay.configureAdmin }}
    SUPER_USERS:
    - {{ .Values.quay.adminUser }}
    FEATURE_USER_INITIALIZE: {{ .Values.quay.userInitialize }}
    {{- end }}
    {{- if .Values.quay.s4.enabled }}
    # S3-compatible object storage via S4 (in-cluster)
    # Used on AWS where OBC/ODF is not available
    DISTRIBUTED_STORAGE_CONFIG:
      s4Storage:
        - RadosGWStorage
        - access_key: {{ .Values.quay.s4.accessKey }}
          secret_key: {{ .Values.quay.s4.secretKey }}
          bucket_name: {{ .Values.quay.s4.bucketName }}
          hostname: s4-service.{{ .Values.quay.s4.namespace }}.svc.cluster.local
          port: 80
          is_secure: false
          storage_path: /datastorage/registry
    DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS:
    - s4Storage
    DISTRIBUTED_STORAGE_PREFERENCE:
    - s4Storage
    {{- end }}
