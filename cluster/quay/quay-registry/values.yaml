nameOverride: "quay"

quay:
  displayName: "RHDH Quay"
  host:
  tls: true
  configureAdmin: true
  adminUser: quayadmin
  adminUserPassword: 
  userInitialize: true
  # S4 in-cluster S3 config (required on AWS — no OBC/ODF operator available)
  s4:
    enabled: true
    namespace: s4
    bucketName: quay-registry
    accessKey: s4admin
    secretKey: ""
    host: ""
  component:
    postgres:
      managed: true
      overrides:
        resources:
          requests:
            cpu: 125m
            memory: 1Gi
    clairpostgres:
      managed: true
      overrides:
        resources:
          requests:
            cpu: 125m
            memory: 1Gi
    objectstorage:
      # managed: false — OBC not available on AWS; S3 config provided via config-bundle
      managed: false
    redis:
      managed: true
    tls:
      managed: true
    route:
      managed: true
    clair:
      managed: true
      overrides:
        resources:
          requests:
            cpu: 125m
            memory: 1Gi
    horizontalpodautoscaler:
      managed: false
    mirror:
      managed: false
    monitoring:
      managed: false
    quay:
      managed: true
      overrides:
        resources:
          requests:
            cpu: 125m
            memory: 1Gi
  organizations: []
  users: []


vault:
  name: vault
  namespace: vault

argocd:
  enabled: true
  quay:
    syncwave: "0"
  config:
    syncwave: "1"
