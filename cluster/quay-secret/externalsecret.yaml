---
# Plain ExternalSecret — NOT Helm-rendered.
# Pulls S4 credentials from Vault and builds the quay-config-bundle
# Secret with S3 connection details for Quay objectstorage.
#
# S4 service: s4.s4.svc.cluster.local:7480 (RGW S3 API port)
# VAULT PATH: secrets/s4 -> {access_key, secret_key}
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quay-config-bundle
  namespace: quay-registry
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: quay-config-bundle
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          REGISTRY_TITLE: RHDH Quay
          SERVER_HOSTNAME: quay-quay-registry.quay-registry.svc.cluster.local
          EXTERNAL_TLS_TERMINATION: true
          CREATE_PRIVATE_REPO_ON_PUSH: false
          SUPER_USERS:
          - quayadmin
          FEATURE_USER_INITIALIZE: true
          DISTRIBUTED_STORAGE_CONFIG:
            s4Storage:
              - RadosGWStorage
              - access_key: "{{ .s4_access_key }}"
                secret_key: "{{ .s4_secret_key }}"
                bucket_name: quay-registry
                hostname: s4.s4.svc.cluster.local
                port: 7480
                is_secure: false
                storage_path: /datastorage/registry
          DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS:
          - s4Storage
          DISTRIBUTED_STORAGE_PREFERENCE:
          - s4Storage
  data:
  - secretKey: s4_access_key
    remoteRef:
      key: secrets/s4
      property: access_key
  - secretKey: s4_secret_key
    remoteRef:
      key: secrets/s4
      property: secret_key
