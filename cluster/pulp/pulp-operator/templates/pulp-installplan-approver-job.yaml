apiVersion: batch/v1
kind: Job
metadata:
  name: pulp-installplan-approve
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: pulp-installplan-approver
      containers:
      - name: patch
        image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
        command:
          - /bin/bash
          - -c
          - |
            echo "Waiting for Pulp Operator InstallPlan to exist..."            
            install_plan=""
            until [[ ${install_plan} != "" ]]
            do
              oc get installplan
              install_plan=$(oc get installplan | grep "pulp-operator" | grep false | cut -d" " -f1)
              if [[ ${install_plan} == "" ]]
              then
                sleep 15
              fi
            done
            oc patch installplan ${install_plan} --type merge --patch '{"spec":{"approved":true }}'
            echo "Pulp Operator InstallPlan Approved"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
